<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зиратстан — Панель Модерации</title>
    <link rel="icon" href="ziratstan-app/src/app/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #09090b;
            --surface: #111113;
            --surface-2: #1a1a1e;
            --border: rgba(255, 255, 255, 0.07);
            --text: #f4f4f5;
            --muted: #71717a;
            --gold: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.1);
            --green: #22c55e;
            --green-dim: rgba(34, 197, 94, 0.1);
            --red: #ef4444;
            --red-dim: rgba(239, 68, 68, 0.1);
            --yellow: #eab308;
            --yellow-dim: rgba(234, 179, 8, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── PASSWORD GATE ── */
        #gate {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }

        .gate-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .gate-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .gate-logo span {
            color: var(--gold);
        }

        .gate-sub {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 28px;
        }

        .gate-input {
            width: 100%;
            padding: 13px 16px;
            background: #18181b;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .gate-input:focus {
            border-color: var(--gold);
        }

        .gate-btn {
            width: 100%;
            padding: 13px;
            background: var(--gold);
            color: #09090b;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s;
        }

        .gate-btn:hover {
            opacity: 0.88;
        }

        .gate-error {
            color: var(--red);
            font-size: 0.82rem;
            margin-top: 10px;
            display: none;
        }

        /* ── ADMIN PANEL ── */
        #panel {
            display: none;
        }

        nav {
            height: 60px;
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .nav-logo span {
            color: var(--gold);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-pending {
            background: var(--yellow-dim);
            color: var(--yellow);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 99px;
            padding: 3px 10px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .logout-btn {
            padding: 5px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: inherit;
            font-size: 0.78rem;
            cursor: pointer;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem 6rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.88rem;
            margin-bottom: 2rem;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            padding: 9px 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--muted);
            font-family: inherit;
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--bg);
            color: var(--text);
        }

        .tab-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--gold);
            color: #09090b;
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: 800;
            margin-left: 6px;
        }

        /* ── CARDS ── */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 20px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
            align-items: start;
            transition: border 0.2s;
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-type-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 8px;
            border-radius: 5px;
            margin-bottom: 8px;
        }

        .badge-names {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .badge-profiles {
            background: var(--gold-dim);
            color: var(--gold);
        }

        .badge-bios {
            background: rgba(34, 197, 94, 0.12);
            color: var(--green);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-detail {
            font-size: 0.78rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .card-detail strong {
            color: var(--text);
            font-weight: 600;
        }

        .card-meta-row {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .card-meta-item {
            font-size: 0.73rem;
            color: var(--muted);
        }

        .card-meta-item span {
            color: var(--text);
            font-weight: 500;
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 130px;
        }

        .btn-approve,
        .btn-reject {
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            border: none;
            transition: opacity 0.2s;
            text-align: center;
        }

        .btn-approve {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .btn-approve:hover {
            background: rgba(34, 197, 94, 0.2);
        }

        .btn-reject {
            background: var(--red-dim);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-reject:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .status-chip {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 99px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending {
            background: var(--yellow-dim);
            color: var(--yellow);
        }

        .status-approved {
            background: var(--green-dim);
            color: var(--green);
        }

        .status-rejected {
            background: var(--red-dim);
            color: var(--red);
        }

        /* ── EMPTY, LOADING ── */
        .empty,
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }

        .empty-icon,
        .loading-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 999;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.25s;
        }

        .toast-success {
            background: var(--green);
            color: #09090b;
        }

        .toast-error {
            background: var(--red);
            color: #fff;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (max-width: 600px) {
            .card {
                grid-template-columns: 1fr;
            }

            .card-actions {
                flex-direction: row;
            }

            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- PASSWORD GATE -->
    <div id="gate">
        <div class="gate-box">
            <div class="gate-logo"><span>З</span>иратстан</div>
            <div class="gate-sub">Панель модерации UGC контента</div>
            <label for="gateInput" style="display:none;">Пароль</label>
            <input type="password" class="gate-input" id="gateInput" placeholder="••••••••"
                onkeydown="if(event.key==='Enter') checkPassword()" />
            <button class="gate-btn" onclick="checkPassword()">Войти</button>
            <div class="gate-error" id="gateError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="panel">
        <nav>
            <div class="nav-logo"><span>З</span>иратстан <span
                    style="color:var(--muted); font-size:0.75rem; font-weight:400; font-family:Inter;">/
                    Модерация</span></div>
            <div class="nav-right">
                <span class="badge-pending" id="totalPendingBadge">0 на проверке</span>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>
        </nav>

        <div class="container">
            <h1>🛡 Панель модерации</h1>
            <p class="subtitle">Проверка и одобрение пользовательских данных (UGC) перед публикацией на карте.</p>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('names', this)">✍️ Названия кладбищ <span
                        class="tab-count" id="cnt-names">0</span></button>
                <button class="tab" onclick="switchTab('profiles', this)">👤 Новые личности <span class="tab-count"
                        id="cnt-profiles">0</span></button>
                <button class="tab" onclick="switchTab('bios', this)">📖 Биографии <span class="tab-count"
                        id="cnt-bios">0</span></button>
            </div>

            <div id="content-names" class="cards-list"></div>
            <div id="content-profiles" class="cards-list" style="display:none;"></div>
            <div id="content-bios" class="cards-list" style="display:none;"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase/client.js"></script>
    <script>
        // ── CONFIG ──
        const ADMIN_PASSWORD = 'zirat2025'; // Простой пароль — потом заменить на Supabase Auth

        let currentTab = 'names';
        let allData = { names: [], profiles: [], bios: [] };

        // ── GATE ──
        function checkPassword() {
            const val = document.getElementById('gateInput').value;
            if (val === ADMIN_PASSWORD) {
                document.getElementById('gate').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                loadAllData();
            } else {
                document.getElementById('gateError').style.display = 'block';
                document.getElementById('gateInput').style.borderColor = 'var(--red)';
            }
        }

        function logout() {
            document.getElementById('gate').style.display = 'flex';
            document.getElementById('panel').style.display = 'none';
            document.getElementById('gateInput').value = '';
            document.getElementById('gateError').style.display = 'none';
        }

        // ── TABS ──
        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            ['names', 'profiles', 'bios'].forEach(t => {
                document.getElementById(`content-${t}`).style.display = t === tab ? 'flex' : 'none';
                document.getElementById(`content-${t}`).style.flexDirection = 'column';
            });
        }

        // ── LOAD DATA ──
        async function loadAllData() {
            showLoading('names'); showLoading('profiles'); showLoading('bios');

            try {
                const [namesRes, profilesRes, biosRes] = await Promise.all([
                    db.from('ugc_submissions').select('*').order('submitted_at', { ascending: false }).limit(100),
                    db.from('ugc_profile_submissions').select('*').order('submitted_at', { ascending: false }).limit(100),
                    db.from('ugc_bio_submissions').select('*').order('submitted_at', { ascending: false }).limit(100),
                ]);

                allData.names = namesRes.data || [];
                allData.profiles = profilesRes.data || [];
                allData.bios = biosRes.data || [];

                renderTab('names', allData.names);
                renderTab('profiles', allData.profiles);
                renderTab('bios', allData.bios);

                updateCounts();
            } catch (err) {
                console.error('Error loading data:', err);
                showToast('❌ Ошибка загрузки данных из Supabase', 'error');
                showEmpty('names', 'Ошибка подключения к базе данных');
                showEmpty('profiles', 'Ошибка подключения к базе данных');
                showEmpty('bios', 'Ошибка подключения к базе данных');
            }
        }

        function updateCounts() {
            const pendingN = allData.names.filter(x => x.status === 'pending').length;
            const pendingP = allData.profiles.filter(x => x.status === 'pending').length;
            const pendingB = allData.bios.filter(x => x.status === 'pending').length;
            const total = pendingN + pendingP + pendingB;

            document.getElementById('cnt-names').textContent = pendingN;
            document.getElementById('cnt-profiles').textContent = pendingP;
            document.getElementById('cnt-bios').textContent = pendingB;
            document.getElementById('totalPendingBadge').textContent = `${total} на проверке`;
        }

        // ── RENDER ──
        function showLoading(tab) {
            document.getElementById(`content-${tab}`).innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
        }

        function showEmpty(tab, msg = 'Заявок нет') {
            document.getElementById(`content-${tab}`).innerHTML = `<div class="empty"><div class="empty-icon">✅</div><p>${msg}</p></div>`;
        }

        function renderTab(tab, items) {
            if (!items.length) { showEmpty(tab); return; }
            const container = document.getElementById(`content-${tab}`);
            container.innerHTML = '';
            items.forEach(item => container.appendChild(createCard(tab, item)));
        }

        function createCard(type, item) {
            const div = document.createElement('div');
            div.className = 'card';
            div.id = `card-${item.id}`;

            const submitted = new Date(item.submitted_at).toLocaleString('ru-KZ');
            const statusClass = `status-${item.status}`;
            const statusText = item.status === 'pending' ? 'На проверке' : item.status === 'approved' ? 'Одобрено' : 'Отклонено';

            let content = '';
            let badgeClass = '';
            let title = '';

            if (type === 'names') {
                badgeClass = 'badge-names';
                title = item.suggested_name;
                content = `
                <div class="card-meta-row">
                    <div class="card-meta-item">Текущее название: <span>${item.current_name || '—'}</span></div>
                    <div class="card-meta-item">Координаты: <span>${item.lat || '?'}, ${item.lng || '?'}</span></div>
                </div>
                ${item.comment ? `<div class="card-detail" style="margin-top:8px;">💬 ${item.comment}</div>` : ''}`;
            } else if (type === 'profiles') {
                badgeClass = 'badge-profiles';
                title = item.full_name;
                content = `
                <div class="card-meta-row">
                    <div class="card-meta-item">Годы: <span>${item.birth_year || '?'} — ${item.death_year || '?'}</span></div>
                    <div class="card-meta-item">Кладбище: <span>${item.cemetery_name || '—'}</span></div>
                </div>
                ${item.description ? `<div class="card-detail" style="margin-top:8px;">${item.description}</div>` : ''}`;
            } else if (type === 'bios') {
                badgeClass = 'badge-bios';
                title = `Дополнение к профилю #${item.profile_id?.substring(0, 8) || '?'}`;
                content = `
                ${item.author_name ? `<div class="card-detail" style="margin-bottom:6px;">От: <strong>${item.author_name}</strong></div>` : ''}
                <div class="card-detail" style="background:#18181b; border-radius:8px; padding:10px; margin-top:6px; line-height:1.6;">"${item.bio_text}"</div>`;
            }

            const typeLabel = type === 'names' ? 'Название' : type === 'profiles' ? 'Личность' : 'Биография';

            div.innerHTML = `
            <div>
                <span class="card-type-badge ${badgeClass}">${typeLabel}</span>
                <div class="card-title">${title}</div>
                ${content}
                <div class="card-meta-row" style="margin-top:12px;">
                    <div class="card-meta-item">🕐 <span>${submitted}</span></div>
                    <span class="status-chip ${statusClass}">${statusText}</span>
                </div>
            </div>
            <div class="card-actions">
                ${item.status === 'pending' ? `
                    <button class="btn-approve" onclick="updateStatus('${type}', '${item.id}', 'approved')">✅ Одобрить</button>
                    <button class="btn-reject" onclick="updateStatus('${type}', '${item.id}', 'rejected')">❌ Отклонить</button>
                ` : `<span style="font-size:0.75rem; color:var(--muted); text-align:right;">Уже обработано</span>`}
            </div>`;
            return div;
        }

        // ── ACTIONS ──
        async function updateStatus(type, id, status) {
            const tableMap = {
                names: 'ugc_submissions',
                profiles: 'ugc_profile_submissions',
                bios: 'ugc_bio_submissions'
            };
            const table = tableMap[type];
            const btn = document.querySelector(`#card-${id} .btn-${status === 'approved' ? 'approve' : 'reject'}`);
            if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }

            try {
                const { error } = await db.from(table).update({ status }).eq('id', id);
                if (error) throw error;

                // Update in local data
                const item = allData[type].find(x => x.id === id);
                if (item) item.status = status;
                updateCounts();

                // Re-render the card
                const card = document.getElementById(`card-${id}`);
                if (card) {
                    const newCard = createCard(type, item);
                    card.replaceWith(newCard);
                }

                showToast(status === 'approved' ? '✅ Одобрено и опубликовано!' : '❌ Заявка отклонена', status === 'approved' ? 'success' : 'error');
            } catch (err) {
                console.error('Error updating status:', err);
                showToast('❌ Ошибка при обновлении статуса', 'error');
                if (btn) { btn.disabled = false; btn.textContent = status === 'approved' ? '✅ Одобрить' : '❌ Отклонить'; }
            }
        }

        // ── TOAST ──
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast toast-${type} show`;
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>

</body>

</html>
