<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сброс пароля — Зиратстан</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #09090b;
      --surface: #111113;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #d4af37;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    label { display: block; font-size: 0.85rem; margin: 0 0 8px; color: var(--muted); }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #09090b;
      color: var(--text);
      padding: 12px;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #09090b;
    }

    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 12px; min-height: 20px; font-size: 0.88rem; }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--success); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Новый пароль</h1>
    <p>Введите новый пароль для вашего аккаунта.</p>
    <form id="reset-form">
      <label for="password">Пароль (минимум 6 символов)</label>
      <input name="password" id="password" type="password" required minlength="6" autocomplete="new-password" />
      <label for="password-confirm">Повторите пароль</label>
      <input name="password-confirm" id="password-confirm" type="password" required minlength="6" autocomplete="new-password" />
      <button id="submit-btn" type="submit">Обновить пароль</button>
      <div id="status-msg" class="msg"></div>
    </form>
  </main>

  <script src="src/js/config.public.js"></script>
  <script src="src/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const statusMsg = document.getElementById('status-msg');
    const submitBtn = document.getElementById('submit-btn');
    const form = document.getElementById('reset-form');

    function showMessage(type, text) {
      statusMsg.className = `msg ${type}`;
      statusMsg.textContent = text;
    }

    function cleanupAuthUrl() {
      const url = new URL(window.location.href);
      const authQueryKeys = ['code', 'type', 'error', 'error_code', 'error_description', 'state'];
      authQueryKeys.forEach((key) => url.searchParams.delete(key));
      url.hash = '';
      window.history.replaceState(null, '', `${url.pathname}${url.search}`);
    }

    async function initSupabaseSession(sb) {
      const url = new URL(window.location.href);
      const hash = new URLSearchParams(url.hash.startsWith('#') ? url.hash.slice(1) : '');
      const code = url.searchParams.get('code');
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');

      if (code) {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) throw error;
      } else if (accessToken && refreshToken) {
        const { error } = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });
        if (error) throw error;
      }

      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      if (!data || !data.session) {
        throw new Error('Ссылка для сброса пароля недействительна или истекла.');
      }

      cleanupAuthUrl();
    }

    async function bootstrap() {
      const cfg = window.ZiratConfig?.getSupabaseConfig?.() || {};
      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase?.createClient) {
        showMessage('error', 'Конфигурация авторизации недоступна. Обратитесь в поддержку.');
        submitBtn.disabled = true;
        return null;
      }

      const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
        auth: {
          flowType: 'pkce',
          detectSessionInUrl: true,
          persistSession: true,
        },
      });

      try {
        await initSupabaseSession(sb);
        return sb;
      } catch (error) {
        showMessage('error', error.message || 'Не удалось подтвердить ссылку сброса.');
        submitBtn.disabled = true;
        return null;
      }
    }

    bootstrap().then((sb) => {
      if (!sb) return;

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('password-confirm').value;

        if (password.length < 6) {
          showMessage('error', 'Пароль должен быть не короче 6 символов.');
          return;
        }

        if (password !== passwordConfirm) {
          showMessage('error', 'Пароли не совпадают.');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Сохраняем...';
        showMessage('', '');

        const { error } = await sb.auth.updateUser({ password });
        if (error) {
          showMessage('error', error.message || 'Не удалось обновить пароль.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Обновить пароль';
          return;
        }

        showMessage('success', 'Пароль обновлен. Теперь можно войти с новым паролем.');
        submitBtn.textContent = 'Готово';
      });
    });
  </script>
</body>
</html>
