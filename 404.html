<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зиратстан — Бет табылмады</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <style>
        :root {
            --bg: #0b0b0f;
            --surface: #15151b;
            --border: rgba(255, 255, 255, 0.08);
            --text: #f3f3f6;
            --muted: #a1a1aa;
            --gold: #d4af37;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 38%),
                linear-gradient(180deg, #09090b 0%, #0f1015 100%);
            color: var(--text);
            font-family: Inter, Arial, sans-serif;
        }

        .card {
            width: min(100%, 520px);
            background: rgba(21, 21, 27, 0.92);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
        }

        .code {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(212, 175, 55, 0.12);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 18px 0 12px;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.05;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1rem;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            background: var(--gold);
            color: #111;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="code" data-i18n="page404_label">404</div>
        <h1 data-i18n="page404_heading">Бет табылмады</h1>
        <p data-i18n="page404_desc">Сұралған бет сайттан табылмады. Сілтемені тексеріңіз немесе басты бетке оралыңыз.</p>
        <div class="actions">
            <a class="btn" href="index.html"><span aria-hidden="true">↩</span><span data-i18n="page404_home">Басты бетке оралу</span></a>
        </div>
    </main>

    <script src="src/js/core/locales.js"></script>
    <script src="src/js/core/i18n.js"></script>
    <script>
        (function () {
            function applyHead() {
                if (!window.i18n) return;
                document.title = i18n.t('page404_title');
            }
            document.addEventListener('langchange', applyHead);
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', applyHead);
            else applyHead();
        })();
    </script>
</body>
</html>
